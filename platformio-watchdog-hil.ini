[platformio]
src_dir = .
include_dir = include
build_dir = build/platformio-watchdog-hil

[env:nucleo_g474re_watchdog_hil]
platform = ststm32@19.7.0
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
build_src_filter =
  -<*>
  +<src/oomwoo_protocol.c>
  +<src/oomwoo_messages.c>
  +<src/oomwoo_cpu_ingress.c>
  +<src/oomwoo_cpu_watchdog.c>
  +<src/oomwoo_cpu_watchdog_bridge.c>
  +<examples/watchdog_hil/main.cpp>
build_flags =
  -Wall
  -Wextra
  -Werror
