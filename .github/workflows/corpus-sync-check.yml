name: Corpus sync check

# Best-effort monitor (not part of PR/push CI): flags when the upstream
# command-gate corpus diverges from the vendored, SHA-pinned copy so a
# maintainer can review and deliberately sync. Scheduled runs are best-effort:
# GitHub may delay or drop them, and public-repo schedules pause after 60 days
# of repository inactivity.

on:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday 06:17 UTC (off minute zero)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check vendored corpus against upstream
        run: python3 tools/check_corpus_sync.py
