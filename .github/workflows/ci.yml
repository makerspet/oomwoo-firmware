name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: C protocol conformance (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: v1 default
            version_flag: -DOOMWOO_PROTOCOL_EXPECTED_VERSION=1
          - name: v2 override
            version_flag: >-
              -DOOMWOO_PROTOCOL_VERSION=2
              -DOOMWOO_PROTOCOL_EXPECTED_VERSION=2
    steps:
      - uses: actions/checkout@v6

      - name: Compile and run with sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            ${{ matrix.version_flag }} \
            -fsanitize=address,undefined \
            -Iinclude \
            src/oomwoo_protocol.c \
            tests/protocol_conformance.c \
            -o /tmp/oomwoo_protocol_conformance
          /tmp/oomwoo_protocol_conformance

      - name: Check C++ compatibility
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            ${{ matrix.version_flag }} \
            -Iinclude -x c++ src/oomwoo_protocol.c \
            -c -o /tmp/oomwoo_protocol_cpp.o

  messages:
    name: Typed message conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify generated canonical vectors
        run: python3 tools/generate_message_vectors.py --check

      - name: Compile and run as strict C11
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            tests/message_conformance.c \
            -o /tmp/oomwoo_message_conformance
          /tmp/oomwoo_message_conformance

      - name: Compile and run as C++17
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude -x c++ \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            tests/message_conformance.c \
            -o /tmp/oomwoo_message_conformance_cpp
          /tmp/oomwoo_message_conformance_cpp

      - name: Compile and run CPU ingress as strict C11
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            src/oomwoo_cpu_ingress.c \
            tests/cpu_ingress_conformance.c \
            -o /tmp/oomwoo_cpu_ingress_conformance
          /tmp/oomwoo_cpu_ingress_conformance

      - name: Compile and run CPU ingress as C++17
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude -x c++ \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            src/oomwoo_cpu_ingress.c \
            tests/cpu_ingress_conformance.c \
            -o /tmp/oomwoo_cpu_ingress_conformance_cpp
          /tmp/oomwoo_cpu_ingress_conformance_cpp

  platformio:
    name: PlatformIO native + Nucleo G474
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Run native Unity tests for wire v1 and v2
        run: pio test -e native -e native_v2

      - name: Resolve pinned STM32 toolchain
        run: pio pkg install -e nucleo_g474re

      - name: Cross-build Nucleo G474RE for wire v1 and v2
        run: pio run -e nucleo_g474re -e nucleo_g474re_v2

      - name: Verify firmware images
        run: |
          test -s .pio/build/nucleo_g474re/firmware.bin
          test -s .pio/build/nucleo_g474re_v2/firmware.bin
