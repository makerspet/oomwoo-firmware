name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    name: C protocol conformance (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: v1 default
            version_flag: -DOOMWOO_PROTOCOL_EXPECTED_VERSION=1
          - name: v2 override
            version_flag: >-
              -DOOMWOO_PROTOCOL_VERSION=2
              -DOOMWOO_PROTOCOL_EXPECTED_VERSION=2
    steps:
      - uses: actions/checkout@v6

      - name: Compile and run with sanitizers
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            ${{ matrix.version_flag }} \
            -fsanitize=address,undefined \
            -Iinclude \
            src/oomwoo_protocol.c \
            tests/protocol_conformance.c \
            -o /tmp/oomwoo_protocol_conformance
          /tmp/oomwoo_protocol_conformance

      - name: Check C++ compatibility
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            ${{ matrix.version_flag }} \
            -Iinclude -x c++ src/oomwoo_protocol.c \
            -c -o /tmp/oomwoo_protocol_cpp.o

  messages:
    name: Typed message conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify generated canonical vectors
        run: python3 tools/generate_message_vectors.py --check

      - name: Compile and run as strict C11
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            tests/message_conformance.c \
            -o /tmp/oomwoo_message_conformance
          /tmp/oomwoo_message_conformance

      - name: Compile and run as C++17
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude -x c++ \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            tests/message_conformance.c \
            -o /tmp/oomwoo_message_conformance_cpp
          /tmp/oomwoo_message_conformance_cpp

      - name: Compile and run CPU ingress as strict C11
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            src/oomwoo_cpu_ingress.c \
            tests/cpu_ingress_conformance.c \
            -o /tmp/oomwoo_cpu_ingress_conformance
          /tmp/oomwoo_cpu_ingress_conformance

      - name: Compile and run CPU ingress as C++17
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude -x c++ \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            src/oomwoo_cpu_ingress.c \
            tests/cpu_ingress_conformance.c \
            -o /tmp/oomwoo_cpu_ingress_conformance_cpp
          /tmp/oomwoo_cpu_ingress_conformance_cpp

      - name: Verify generated command gate vectors
        run: python3 tools/generate_gate_vectors.py --check

      - name: Compile and run command gate as strict C11
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            src/oomwoo_cpu_ingress.c \
            tests/command_gate_conformance.c \
            -o /tmp/oomwoo_command_gate_conformance
          /tmp/oomwoo_command_gate_conformance

      - name: Compile and run command gate as C++17
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude -x c++ \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            src/oomwoo_cpu_ingress.c \
            tests/command_gate_conformance.c \
            -o /tmp/oomwoo_command_gate_conformance_cpp
          /tmp/oomwoo_command_gate_conformance_cpp

      - name: Compile and run identity handshake as strict C11
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            src/oomwoo_cpu_ingress.c \
            src/oomwoo_identity.c \
            tests/identity_conformance.c \
            -o /tmp/oomwoo_identity_conformance
          /tmp/oomwoo_identity_conformance

      - name: Compile and run identity handshake as C++17
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined \
            -Iinclude -x c++ \
            src/oomwoo_protocol.c \
            src/oomwoo_messages.c \
            src/oomwoo_cpu_ingress.c \
            src/oomwoo_identity.c \
            tests/identity_conformance.c \
            -o /tmp/oomwoo_identity_conformance_cpp
          /tmp/oomwoo_identity_conformance_cpp

  platformio:
    name: PlatformIO native + Nucleo G474
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Run native Unity tests for wire v1 and v2
        run: pio test -e native -e native_v2

      - name: Resolve pinned STM32 toolchain
        run: pio pkg install -e nucleo_g474re

      - name: Cross-build Nucleo G474RE for wire v1 and v2
        run: pio run -e nucleo_g474re -e nucleo_g474re_v2

      - name: Verify firmware images
        run: |
          test -s .pio/build/nucleo_g474re/firmware.bin
          test -s .pio/build/nucleo_g474re_v2/firmware.bin

  mcu:
    name: CH32 firmware (U13 CH32V307, U28 CH32L103, dock CH32V003)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/opt/xpack-riscv-none-elf-gcc-14.3.0-1
            mcu/third_party
          key: ${{ runner.os }}-ch32-${{ hashFiles('mcu/scripts/*.sh') }}

      - name: Toolchain and WCH SDK
        run: |
          eval "$(mcu/scripts/install-toolchain.sh | tail -1)"
          echo "$HOME/opt/xpack-riscv-none-elf-gcc-14.3.0-1/bin" >> "$GITHUB_PATH"
          mcu/scripts/fetch-wch-sdk.sh

      - name: Host tests of the shared logic
        run: make -C mcu test

      - name: Build all images, robot board and evaluation boards
        run: |
          make -C mcu all
          make -C mcu BOARD=evt all
          for f in robot/u13 robot/u28 robot/dock evt/u13 evt/u28; do test -s mcu/build/$f.bin; done

  arduino:
    name: Arduino sketch (U28 on WCH's core)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15
            ~/opt/bin/arduino-cli
          key: ${{ runner.os }}-arduino-${{ hashFiles('mcu/scripts/setup.sh') }}

      - name: arduino-cli and WCH's core
        run: |
          mkdir -p ~/opt/bin
          if [ ! -x ~/opt/bin/arduino-cli ]; then
            curl -fsSL https://github.com/arduino/arduino-cli/releases/download/v1.6.0/arduino-cli_1.6.0_Linux_64bit.tar.gz               | tar -xz -C ~/opt/bin arduino-cli
          fi
          echo "$HOME/opt/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/opt/bin:$PATH"
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls             https://github.com/openwch/board_manager_files/raw/main/package_ch32v_index.json
          arduino-cli core update-index
          arduino-cli core install WCH:ch32v@1.0.7

      - name: Build U28 for the robot board and the evaluation board
        run: |
          arduino/build.sh robot --warnings all
          arduino/build.sh evt --warnings all
          test -s arduino/build/u28-robot/U28.ino.bin
          test -s arduino/build/u28-evt/U28.ino.bin
